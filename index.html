<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VYROVA LOGIN</title>

<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'DM Sans',sans-serif;
background:#07080f;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
color:#fff;
}

.bg{
position:fixed;
inset:0;
background:
radial-gradient(circle at 20% 20%,rgba(109,40,217,.25),transparent 35%),
radial-gradient(circle at 80% 80%,rgba(37,99,235,.25),transparent 35%),
radial-gradient(circle at 60% 40%,rgba(13,148,136,.15),transparent 40%);
animation:move 8s infinite alternate ease-in-out;
}

@keyframes move{
from{transform:scale(1);}
to{transform:scale(1.12);}
}

.grid{
position:fixed;
inset:0;
background-image:
linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),
linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);
background-size:50px 50px;
}

.card{

position:relative;
z-index:5;

width:470px;

background:rgba(17,20,33,.65);

border:1px solid rgba(255,255,255,.08);

backdrop-filter:blur(24px);

border-radius:30px;

padding:45px;

box-shadow:
0 25px 80px rgba(0,0,0,.45),
0 0 60px rgba(109,40,217,.18);

}

.logo{

display:flex;
align-items:center;
gap:14px;
margin-bottom:35px;

}

.mark{

width:58px;
height:58px;

border-radius:18px;

background:linear-gradient(135deg,#6d28d9,#2563eb);

display:flex;
justify-content:center;
align-items:center;

font-family:'Syne';
font-size:26px;
font-weight:800;

box-shadow:0 0 35px rgba(109,40,217,.45);

}

.logo h1{

font-family:'Syne';
font-size:28px;
letter-spacing:2px;

}

.sub{

font-size:12px;
color:#8f97bb;
margin-top:3px;
letter-spacing:1px;

}

.title{

font-family:'Syne';
font-size:42px;
line-height:1.1;
margin-bottom:12px;

}

.desc{

color:#8e96b7;
line-height:1.7;
margin-bottom:35px;

}

.group{

margin-bottom:20px;

}

.label{

font-size:13px;
margin-bottom:10px;
color:#9ba4ca;

}

.inputbox{

display:flex;
align-items:center;

background:#151a2c;

border:1px solid #232944;

border-radius:16px;

padding:0 18px;

transition:.25s;

}

.inputbox:focus-within{

border-color:#8b5cf6;
box-shadow:0 0 25px rgba(109,40,217,.25);

}

.icon{

font-size:18px;
margin-right:12px;

}

input{

width:100%;
height:60px;

background:none;
border:none;
outline:none;

font-size:15px;
color:#fff;

}

.eye{

cursor:pointer;
font-size:18px;

}

button{

width:100%;
height:62px;

border:none;

border-radius:18px;

background:linear-gradient(135deg,#6d28d9,#2563eb);

font-family:'Syne';

font-size:16px;
font-weight:700;

color:#fff;

cursor:pointer;

margin-top:14px;

transition:.25s;

}

button:hover{

transform:translateY(-2px);

box-shadow:0 14px 35px rgba(109,40,217,.45);

}

.footer{

margin-top:22px;
text-align:center;
font-size:13px;
color:#7680a7;

}

#error{

margin-top:18px;
text-align:center;
color:#ff5376;

}

</style>
</head>

<body>

<div class="bg"></div>
<div class="grid"></div>

<div class="card">

<div class="logo">

<div class="mark">V</div>

<div>

<h1>VYROVA</h1>

<div class="sub">
AI CREATIVE SUITE
</div>

</div>

</div>

<div class="title">

Welcome Back.

</div>

<div class="desc">

Secure access to your creative workspace.

Login to continue.

</div>

<div class="group">

<div class="label">
Username
</div>

<div class="inputbox">

<div class="icon">
👤
</div>

<input
id="username"
placeholder="Enter username">

</div>

</div>

<div class="group">

<div class="label">
Password
</div>

<div class="inputbox">

<div class="icon">
🔒
</div>

<input
id="password"
type="password"
placeholder="Enter password">

<div
class="eye"
onclick="toggle()">
👁️
</div>

</div>

</div>

<button onclick="login()">
LOGIN TO VYROVA
</button>

<div id="error"></div>

<div class="footer">

Protected Login • Device Secure

</div>

</div>

<script>

function toggle(){

let p=
document.getElementById("password")

p.type=
p.type==="password"
?
"text"
:
"password"

}

async function login(){

let username=
document.getElementById("username").value

let password=
document.getElementById("password").value

try{

let res=
await fetch(
"http://localhost:3000/login",
{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
username,
password
})

})

let data=
await res.json()

if(data.success){

localStorage.setItem(
"token",
data.token
)

if(data.role==="admin"){

window.location=
"admin.html"

}else{

window.location=
"index.html"

}

}else{

document.getElementById(
"error"
).innerText=
data.message

}

}catch{

document.getElementById(
"error"
).innerText=
"Server Offline"

}

}

</script>

</body>
</html>
