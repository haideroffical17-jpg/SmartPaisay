<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VYROVA LOGIN</title>

<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

font-family:'DM Sans',sans-serif;
background:#07080f;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
color:#fff;

}

.bg{

position:fixed;
inset:0;

background:
radial-gradient(circle at 20% 20%,rgba(109,40,217,.22),transparent 35%),
radial-gradient(circle at 80% 80%,rgba(37,99,235,.22),transparent 35%),
radial-gradient(circle at 50% 40%,rgba(13,148,136,.15),transparent 40%);

animation:bgmove 8s infinite alternate ease-in-out;

}

@keyframes bgmove{

from{
transform:scale(1);
}

to{
transform:scale(1.15);
}

}

.grid{

position:fixed;
inset:0;

background-image:
linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),
linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);

background-size:55px 55px;

}

.card{

position:relative;
z-index:5;

width:500px;

padding:45px;

border-radius:32px;

background:rgba(18,22,37,.72);

backdrop-filter:blur(28px);

border:1px solid rgba(255,255,255,.08);

box-shadow:
0 35px 90px rgba(0,0,0,.45),
0 0 55px rgba(109,40,217,.18);

}

.logo{

display:flex;
align-items:center;
gap:14px;

margin-bottom:30px;

}

.mark{

width:62px;
height:62px;

border-radius:18px;

background:linear-gradient(135deg,#6d28d9,#2563eb);

display:flex;
justify-content:center;
align-items:center;

font-family:'Syne';

font-size:28px;
font-weight:800;

box-shadow:0 0 40px rgba(109,40,217,.5);

}

.logo h1{

font-family:'Syne';
font-size:28px;
letter-spacing:2px;

}

.sub{

font-size:12px;
color:#8b94bb;
letter-spacing:1px;

}

.title{

font-family:'Syne';

font-size:42px;

line-height:1.1;

margin-bottom:12px;

}

.desc{

color:#8f98bf;

line-height:1.8;

margin-bottom:35px;

}

.group{

margin-bottom:22px;

}

.label{

font-size:13px;

margin-bottom:10px;

color:#9ba3cb;

}

.inputbox{

display:flex;
align-items:center;

height:64px;

background:#14192b;

border:1px solid #252d49;

border-radius:18px;

padding:0 18px;

transition:.25s;

}

.inputbox:focus-within{

border-color:#8b5cf6;

box-shadow:0 0 25px rgba(109,40,217,.22);

}

.icon{

font-size:18px;

margin-right:12px;

}

input{

width:100%;
height:100%;

background:none;

border:none;

outline:none;

color:#fff;

font-size:15px;

}

.eye{

cursor:pointer;

font-size:18px;

}

button{

width:100%;

height:65px;

border:none;

border-radius:20px;

cursor:pointer;

margin-top:10px;

background:linear-gradient(135deg,#6d28d9,#2563eb);

color:#fff;

font-family:'Syne';

font-size:16px;

font-weight:700;

transition:.25s;

}

button:hover{

transform:translateY(-2px);

box-shadow:0 15px 40px rgba(109,40,217,.45);

}

.secure{

margin-top:20px;

text-align:center;

font-size:13px;

color:#7782ab;

}

#error{

margin-top:18px;

text-align:center;

color:#ff5a7d;

}

</style>
</head>

<body>

<div class="bg"></div>
<div class="grid"></div>

<div class="card">

<div class="logo">

<div class="mark">V</div>

<div>

<h1>VYROVA</h1>

<div class="sub">
AI CREATIVE SUITE
</div>

</div>

</div>

<div class="title">

Welcome Back.

</div>

<div class="desc">

Secure login to access your dashboard, tools, and premium workspace.

</div>

<div class="group">

<div class="label">
Username
</div>

<div class="inputbox">

<div class="icon">
👤
</div>

<input
id="username"
placeholder="Enter Username">

</div>

</div>

<div class="group">

<div class="label">
Password
</div>

<div class="inputbox">

<div class="icon">
🔒
</div>

<input
id="password"
type="password"
placeholder="Enter Password">

<div
class="eye"
onclick="toggle()">
👁️
</div>

</div>

</div>

<button onclick="login()">

LOGIN TO VYROVA

</button>

<div id="error"></div>

<div class="secure">

Protected Access • Device Safe • Admin Controlled

</div>

</div>

<script>

function toggle(){

let p=
document.getElementById(
"password"
)

p.type=
p.type==="password"
?
"text"
:
"password"

}

function login(){

let username=
document.getElementById(
"username"
).value

let password=
document.getElementById(
"password"
).value

if(

username==="923220498935"
&&
password==="HaiderAli000"

){

window.location=
"admin.html"

}

else{

document.getElementById(
"error"
).innerText=
"Invalid Username Or Password"

}

}

</script>

</body>
</html>
