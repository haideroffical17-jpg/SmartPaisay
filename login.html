<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VYROVA LOGIN</title>
    <!-- Tailwind CSS for high fidelity responsive layout system -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome for sleek modern iconography -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #050814;
        }
    </style>
</head>
<body class="text-slate-100 min-h-screen flex items-center justify-center p-4 relative overflow-hidden antialiased">

    <!-- Tech Ambient Glowing Orbs -->
    <div class="absolute top-[-10%] left-[-10%] w-[500px] h-[500px] bg-indigo-600/10 rounded-full blur-[160px] pointer-events-none"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-[500px] h-[500px] bg-purple-600/10 rounded-full blur-[160px] pointer-events-none"></div>
    <div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-teal-500/5 rounded-full blur-[180px] pointer-events-none"></div>

    <!-- Tech Grid Background -->
    <div class="absolute inset-0 bg-[linear-gradient(rgba(255,255,255,0.015)_1px,transparent_1px),linear-gradient(90deg,rgba(255,255,255,0.015)_1px,transparent_1px)] bg-[size:40px_40px] pointer-events-none"></div>

    <!-- Live Toast Notifications Container -->
    <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col gap-3 max-w-sm w-full"></div>

    <!-- Elegant Responsive Login Form Card -->
    <div class="w-full max-w-[520px] bg-[#0b1022]/70 border border-slate-900 rounded-[32px] p-8 md:p-10 backdrop-blur-2xl shadow-2xl relative z-10">
        
        <!-- Header Controls matching "image_08fda5.png" branding exactly -->
        <div class="flex items-center gap-4 mb-8">
            <!-- Vertical Capsule Logo from screenshot -->
            <div class="w-[44px] h-[68px] bg-gradient-to-b from-[#8b5cf6] via-[#6366f1] to-[#2563eb] rounded-[22px] flex items-center justify-center shadow-lg shadow-indigo-600/30 border border-violet-400/20 shrink-0">
                <!-- Clean White Stylized 'V' logo vector -->
                <svg viewBox="0 0 24 24" class="w-5 h-5 text-white" fill="currentColor">
                    <path d="M3.5 3.5h4.5l4 10.5 4-10.5h4.5l-6.5 17h-4l-6.5-17z"/>
                </svg>
            </div>
            <!-- Title & Subtitle matching original visual identity -->
            <div class="flex flex-col justify-center">
                <h1 class="text-2xl font-extrabold tracking-wider text-white leading-none">
                    VYROVA
                </h1>
                <span class="text-[10px] font-semibold tracking-[0.25em] text-slate-400 mt-2 uppercase leading-none">
                    AI CREATIVE SUITE
                </span>
            </div>
        </div>

        <!-- Form Heading -->
        <div class="mb-8">
            <h2 class="text-3xl font-extrabold text-white tracking-tight">Welcome Back</h2>
            <p class="text-slate-400 text-xs mt-2 leading-relaxed">Sign in to instantly access your customized admin and tools workspace dashboard.</p>
        </div>

        <!-- Credentials Form Block -->
        <form id="loginForm" onsubmit="event.preventDefault();" class="space-y-5">
            <!-- Username input container -->
            <div>
                <label class="block text-[11px] font-semibold text-slate-400 mb-2 uppercase tracking-wider">Username</label>
                <div class="relative group">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-slate-500 group-focus-within:text-indigo-400 transition-colors">
                        <i class="fa-solid fa-user-shield text-sm"></i>
                    </span>
                    <input type="text" id="username" class="w-full h-14 bg-[#050814]/90 border border-slate-850 focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 text-white rounded-2xl pl-12 pr-4 text-sm outline-none transition-all placeholder-slate-600 font-medium" placeholder="Your registered username">
                </div>
            </div>

            <!-- Passcode input container -->
            <div>
                <label class="block text-[11px] font-semibold text-slate-400 mb-2 uppercase tracking-wider">Password</label>
                <div class="relative group">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-slate-500 group-focus-within:text-indigo-400 transition-colors">
                        <i class="fa-solid fa-lock text-sm"></i>
                    </span>
                    <input type="password" id="password" class="w-full h-14 bg-[#050814]/90 border border-slate-850 focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 text-white rounded-2xl pl-12 pr-12 text-sm outline-none transition-all placeholder-slate-600 font-medium" placeholder="Your account security passcode">
                    <button type="button" onclick="togglePasswordVisibility()" class="absolute inset-y-0 right-0 flex items-center pr-4 text-slate-500 hover:text-slate-300 transition-colors">
                        <i id="eye-icon" class="fa-solid fa-eye text-sm"></i>
                    </button>
                </div>
            </div>

            <!-- Action Button -->
            <button type="button" id="loginBtn" onclick="performSecureLogin()" class="w-full h-14 mt-3 bg-gradient-to-r from-violet-600 via-indigo-600 to-blue-600 hover:from-violet-500 hover:to-blue-500 text-white font-extrabold text-sm rounded-2xl shadow-lg shadow-indigo-600/20 hover:shadow-indigo-600/35 active:scale-[0.98] transition-all flex items-center justify-center gap-2.5">
                <span id="btn-text">SIGN IN SECURELY</span>
                <span id="btn-spinner" class="hidden"><i class="fa-solid fa-circle-notch animate-spin text-lg"></i></span>
            </button>
        </form>

        <!-- Dynamic inline live status or warnings -->
        <div id="statusAlert" class="mt-4 text-center text-xs font-semibold hidden animate-pulse"></div>

        <!-- Footnote info -->
        <div class="mt-8 pt-6 border-t border-slate-900 text-center flex items-center justify-center gap-2 text-slate-500 text-xs font-medium">
            <i class="fa-solid fa-shield-halved text-indigo-500/60 text-[10px]"></i>
            <span>Secure Encryption Connection Enabled</span>
        </div>
    </div>

    <!-- Core Database Integrations & Zero Lag Execution Engine -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        // Your exact Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyBuYNUubdCfCktR1cWiKPJquVd8dbB-NUw",
            authDomain: "vyrova-2eb4d.firebaseapp.com",
            projectId: "vyrova-2eb4d",
            storageBucket: "vyrova-2eb4d.firebasestorage.app",
            messagingSenderId: "136436344218",
            appId: "1:136436344218:web:0efa47a4da3f20b7bc8623",
            measurementId: "G-1TNRGDFL4M"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        // Memory cache representing preloaded users
        let preloadedUsersCache = [];
        let isCacheReady = false;
        let pendingAuthenticationAttempt = false;

        // Display notifications (Toasts)
        window.showNotification = function(message, type = "success") {
            const container = document.getElementById("toast-container");
            const toast = document.createElement("div");
            toast.className = `flex items-center gap-3 p-4 rounded-xl shadow-xl border backdrop-blur-md transform translate-y-2 opacity-0 transition duration-300 ${
                type === "success" 
                ? "bg-emerald-950/80 border-emerald-500/30 text-emerald-200" 
                : type === "error" 
                ? "bg-rose-950/80 border-rose-500/30 text-rose-200" 
                : "bg-slate-900/80 border-slate-700/30 text-slate-200"
            }`;
            
            const icon = type === "success" 
                ? '<i class="fa-solid fa-circle-check text-emerald-400"></i>' 
                : type === "error" 
                ? '<i class="fa-solid fa-circle-exclamation text-rose-400"></i>' 
                : '<i class="fa-solid fa-circle-notch animate-spin text-indigo-400"></i>';

            toast.innerHTML = `
                <div class="text-base">${icon}</div>
                <div class="text-xs font-semibold flex-1">${message}</div>
                <button class="text-slate-400 hover:text-white transition" onclick="this.parentElement.remove()">
                    <i class="fa-solid fa-xmark text-xs"></i>
                </button>
            `;

            container.appendChild(toast);
            setTimeout(() => toast.classList.remove("translate-y-2", "opacity-0"), 10);
            setTimeout(() => {
                toast.classList.add("translate-y-2", "opacity-0");
                setTimeout(() => toast.remove(), 300);
            }, 4500);
        }

        // Toggle password character visibility
        window.togglePasswordVisibility = function() {
            const passInput = document.getElementById("password");
            const eyeIcon = document.getElementById("eye-icon");
            if (passInput.type === "password") {
                passInput.type = "text";
                eyeIcon.classList.remove("fa-eye");
                eyeIcon.classList.add("fa-eye-slash");
            } else {
                passInput.type = "password";
                eyeIcon.classList.remove("fa-eye-slash");
                eyeIcon.classList.add("fa-eye");
            }
        }

        /* LIVE REALTIME PRE-LOAD FOR ZERO DELAY ON LOGIN */
        function startPreloadPipeline() {
            // Immediately start streaming current users collection into memory cache
            onSnapshot(collection(db, "users"), (snapshot) => {
                preloadedUsersCache = [];
                snapshot.forEach((doc) => {
                    preloadedUsersCache.push(doc.data());
                });
                
                isCacheReady = true;
                
                // If user already clicked login while data was loading, immediately trigger verification now
                if (pendingAuthenticationAttempt) {
                    pendingAuthenticationAttempt = false;
                    performSecureLogin();
                }
            }, (err) => {
                console.error("Database streaming error:", err);
                showNotification("Database pipe initialization warning. Retrying...", "error");
            });
        }

        /* 100% INSTANT SECURE USER VALIDATION LOOP */
        window.performSecureLogin = function() {
            const username = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value.trim();
            const statusAlert = document.getElementById("statusAlert");

            statusAlert.className = "mt-4 text-center text-xs font-semibold hidden animate-pulse";
            statusAlert.textContent = "";

            if (!username || !password) {
                showNotification("Please fill in both fields.", "error");
                return;
            }

            // Set loading button state
            toggleLoaderState(true);

            // 1. Instant Admin Override Check
            if (username === "923220498935" && password === "HaiderAli000") {
                localStorage.setItem("activeUser", JSON.stringify({
                    username: "ADMIN",
                    role: "admin"
                }));
                showNotification("Authorized successfully! Opening panel...", "success");
                setTimeout(() => {
                    window.location.href = "index.html";
                }, 800);
                return;
            }

            // 2. Database Sync Guard
            // If network sync is still active during immediate clicks, delay and notify
            if (!isCacheReady) {
                pendingAuthenticationAttempt = true;
                statusAlert.textContent = "Connecting to database sync pipeline... Please wait.";
                statusAlert.classList.remove("hidden");
                statusAlert.classList.add("text-indigo-400");
                return;
            }

            // 3. Instant Cache Match Loop (0ms Database Wait!)
            let matchedUser = preloadedUsersCache.find(user => 
                String(user.username).trim().toLowerCase() === username.toLowerCase() && 
                String(user.password).trim() === password
            );

            if (!matchedUser) {
                showNotification("Invalid Username or Passcode.", "error");
                toggleLoaderState(false);
                return;
            }

            // 4. Verify License Durations
            const now = Date.now();
            if (matchedUser.expiry && now > Number(matchedUser.expiry)) {
                showNotification("Access denied! This license key has expired.", "error");
                statusAlert.textContent = "Key Expired! Contact administration.";
                statusAlert.classList.remove("hidden");
                statusAlert.classList.add("text-rose-400");
                toggleLoaderState(false);
                return;
            }

            // 5. Successful Handshake
            localStorage.setItem("activeUser", JSON.stringify({
                username: matchedUser.username,
                role: "user",
                device: matchedUser.device || 1,
                days: matchedUser.days || 30,
                expiry: matchedUser.expiry
            }));

            showNotification("Access Authorized! Forwarding to workspace dashboard.");
            setTimeout(() => {
                window.location.href = "index.html";
            }, 800);
        }

        function toggleLoaderState(isLoading) {
            const btn = document.getElementById("loginBtn");
            const txt = document.getElementById("btn-text");
            const spinner = document.getElementById("btn-spinner");

            if (isLoading) {
                btn.disabled = true;
                btn.classList.add("opacity-75", "cursor-not-allowed");
                txt.textContent = "VERIFYING CREDENTIALS...";
                spinner.classList.remove("hidden");
            } else {
                btn.disabled = false;
                btn.classList.remove("opacity-75", "cursor-not-allowed");
                txt.textContent = "SIGN IN SECURELY";
                spinner.classList.add("hidden");
            }
        }

        // Setup authentication triggers
        document.getElementById("loginForm").addEventListener("keypress", (e) => {
            if (e.key === "Enter") {
                performSecureLogin();
            }
        });

        // Background authentication pipeline activation on viewport ready
        window.onload = async function() {
            try {
                // Perform quick anonymous auth for backend connection authorization
                await signInAnonymously(auth);
                // Preload users instantly in the background
                startPreloadPipeline();
            } catch (err) {
                console.warn("Auth check bypassed. Activating direct pipeline.", err);
                startPreloadPipeline();
            }
        };
    </script>
</body>
</html>
