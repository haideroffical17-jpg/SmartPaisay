<!DOCTYPE html>
<html lang="en" class="h-full select-none">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VYROVA AI - Secure Login</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f5f3ff',
                            100: '#ede9fe',
                            500: '#8b5cf6',
                            600: '#7c3aed',
                            700: '#6d28d9',
                            900: '#4c1d95',
                            950: '#1e1b4b',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts & Font Awesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #03050a;
            color: #f3f4f6;
            overflow-x: hidden;
        }
        .glass-panel {
            background: rgba(8, 10, 20, 0.75);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(139, 92, 246, 0.12);
        }
        .neon-glow {
            box-shadow: 0 0 50px rgba(139, 92, 246, 0.1);
        }
        .animated-mesh {
            background: radial-gradient(circle at 10% 20%, rgba(76, 29, 149, 0.12) 0%, transparent 40%),
                        radial-gradient(circle at 90% 80%, rgba(37, 99, 235, 0.1) 0%, transparent 45%),
                        radial-gradient(circle at 50% 50%, rgba(10, 12, 22, 1) 0%, rgba(3, 5, 10, 1) 100%);
        }
        input:focus {
            box-shadow: 0 0 15px rgba(139, 92, 246, 0.25);
            border-color: #8b5cf6 !important;
        }
    </style>
</head>

<body class="min-h-screen animated-mesh text-slate-100 flex flex-col justify-center relative h-full">

    <!-- Top & Bottom Abstract Glow Overlays -->
    <div class="absolute top-1/4 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] rounded-full bg-brand-600/10 blur-[130px] pointer-events-none"></div>
    <div class="absolute bottom-10 right-10 w-80 h-80 rounded-full bg-blue-600/5 blur-[100px] pointer-events-none"></div>

    <!-- Main Content login layout -->
    <div class="flex-1 flex flex-col justify-center items-center px-4 py-12 relative z-10">
        <!-- Brand Logo Header -->
        <div class="flex flex-col items-center mb-8 text-center">
            <img src="https://i.ibb.co/5XQLZbcm/Tool-Logo.png" alt="VYROVA-Logo" class="h-16 w-auto object-contain mb-4 filter drop-shadow-[0_0_15px_rgba(139,92,246,0.3)]"/>
            <span class="px-3 py-1.5 rounded-full text-[9px] tracking-widest font-black uppercase bg-brand-500/5 text-brand-300 border border-brand-500/15 shadow-sm">
                <i class="fa-solid fa-circle-check mr-1.5 text-brand-400 animate-pulse"></i> VYROVA SECURE GATEWAY
            </span>
        </div>

        <!-- Premium Glass Form Container -->
        <div class="glass-panel neon-glow max-w-md w-full p-8 rounded-3xl relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-[3px] bg-gradient-to-r from-brand-500 via-blue-500 to-emerald-500"></div>

            <div class="mb-6 text-center">
                <h1 class="text-2xl font-black tracking-tight text-white uppercase bg-gradient-to-r from-white via-indigo-100 to-indigo-300 bg-clip-text text-transparent">
                    VYROVA AI CREATIVE SUITE
                </h1>
                <p class="text-xs text-slate-400 mt-2">Apne credentials enter karke session initialize karein.</p>
            </div>

            <form id="loginForm" class="space-y-5">
                <!-- Username Input (Labels hidden) -->
                <div>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-500">
                            <i class="fa-solid fa-user-shield text-sm"></i>
                        </span>
                        <input type="text" id="loginUsername" required placeholder="Phone ya Username" 
                               class="block w-full pl-10 pr-4 py-3.5 rounded-xl border border-slate-800/80 bg-slate-950/90 text-white placeholder-slate-500 focus:outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 text-sm transition-all">
                    </div>
                </div>

                <!-- Password Input (Labels hidden) -->
                <div>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-500">
                            <i class="fa-solid fa-lock text-sm"></i>
                        </span>
                        <input type="password" id="loginPassword" required placeholder="Password" 
                               class="block w-full pl-10 pr-10 py-3.5 rounded-xl border border-slate-800/80 bg-slate-950/90 text-white placeholder-slate-500 focus:outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 text-sm transition-all">
                        <button type="button" onclick="togglePasswordVisibility('loginPassword')" class="absolute inset-y-0 right-0 flex items-center pr-3.5 text-slate-500 hover:text-slate-300">
                            <i class="fa-solid fa-eye" id="loginPasswordEye"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" id="loginSubmitBtn" class="w-full flex justify-center items-center gap-2 py-3.5 px-4 rounded-xl bg-gradient-to-r from-brand-600 via-indigo-600 to-blue-600 hover:from-brand-500 hover:to-blue-500 text-white font-bold text-sm tracking-wide shadow-lg shadow-brand-500/15 active:scale-[0.99] transition-all">
                    <span>Initialize Session</span>
                    <i class="fa-solid fa-circle-notch animate-spin hidden" id="loginLoader"></i>
                    <i class="fa-solid fa-arrow-right-to-bracket text-xs" id="loginArrowIcon"></i>
                </button>
            </form>

            <div class="mt-6 pt-5 border-t border-slate-900 flex items-center justify-between text-[10px] text-slate-500">
                <span class="flex items-center gap-1"><i class="fa-solid fa-shield-halved text-emerald-500"></i> Platform Secure Core</span>
                <span class="flex items-center gap-1">
                    <span id="syncStatusIndicator" class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span> 
                    <span id="syncStatusText">Initializing Sync...</span>
                </span>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="border-t border-slate-950 bg-slate-950 py-4 px-6 text-center text-[10px] text-slate-600 z-10">
        &copy; 2026 Vyrova AI Creative Corp. Built safely utilizing secure cloud synchronization.
    </footer>

    <!-- Floating Toast Notifications -->
    <div id="toastContainer" class="fixed bottom-5 right-5 z-50 flex flex-col gap-3 max-w-sm w-full px-4 sm:px-0"></div>

    <!-- Firebase Implementation -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        // Import initializeAuth and inMemoryPersistence to bypass iframe third-party cookie/IndexedDB restrictions completely
        import { initializeAuth, inMemoryPersistence, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, onSnapshot, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Redirection helper sandbox crash protection ko prevent karne ke liye
        window.safeRedirect = function(targetPage) {
            if (window.location.protocol === 'blob:' || window.location.href.startsWith('blob:')) {
                console.warn(`[VYROVA Sandbox] Redirection to '${targetPage}' bypassed in preview.`);
                window.showToast(`[Sandbox Mode] Redirection to '${targetPage}' simulated.`, "info");
            } else {
                try {
                    window.location.href = targetPage;
                } catch (err) {
                    window.location.replace(targetPage);
                }
            }
        };

        const ADMIN_USERNAME = "923220498935";
        const ADMIN_PASSWORD = "HaiderAli000";

        // Firebase Setup Configuration block
        const firebaseConfig = {
            apiKey: "AIzaSyBuYNUubdCfCktR1cWiKPJquVd8dbB-NUw",
            authDomain: "vyrova-2eb4d.firebaseapp.com",
            projectId: "vyrova-2eb4d",
            storageBucket: "vyrova-2eb4d.firebasestorage.app",
            messagingSenderId: "136436344218",
            appId: "1:136436344218:web:0efa47a4da3f20b7bc8623",
            measurementId: "G-1TNRGDFL4M"
        };

        const app = initializeApp(firebaseConfig);
        // FORCE IN-MEMORY PERSISTENCE: This ensures Auth succeeds even inside restricted iframe sandboxes
        const auth = initializeAuth(app, {
            persistence: inMemoryPersistence
        });
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'vyrova-2eb4d';

        // RULE 1: Strict collection path utilized
        const usersCollectionRef = collection(db, 'artifacts', appId, 'public', 'data', 'users');

        window.localUsersArray = [];
        window.isOfflineMode = false;

        // Premium Toast notifications launcher
        window.showToast = function(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            const icons = {
                success: '<i class="fa-solid fa-circle-check text-emerald-500"></i>',
                error: '<i class="fa-solid fa-circle-xmark text-red-500"></i>',
                info: '<i class="fa-solid fa-circle-info text-blue-500"></i>',
                warning: '<i class="fa-solid fa-triangle-exclamation text-amber-500"></i>'
            };
            toast.className = `flex items-center gap-3 p-4 rounded-xl bg-slate-900 border border-slate-800 shadow-xl transform translate-y-4 opacity-0 transition-all duration-300 select-none`;
            toast.innerHTML = `
                <div class="text-xl">${icons[type] || icons.success}</div>
                <div class="flex-1 text-xs font-semibold text-slate-200">${message}</div>
            `;
            container.appendChild(toast);
            setTimeout(() => {
                toast.classList.remove('translate-y-4', 'opacity-0');
            }, 10);
            setTimeout(() => {
                toast.classList.add('translate-y-4', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        };

        // Advanced Laptop Hardware Fingerprinting
        async function getDeviceFingerprint() {
            let ip = "unknown-ip";
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 2000);
            try {
                const res = await fetch("https://api.ipify.org?format=json", { signal: controller.signal });
                clearTimeout(timeoutId);
                if (res.ok) {
                    const data = await res.json();
                    ip = data.ip;
                }
            } catch (e) {
                clearTimeout(timeoutId);
            }
            const screenResolution = `${screen.width}x${screen.height}`;
            const platform = navigator.platform || "unknown-platform";
            const cpuCores = navigator.hardwareConcurrency || "unknown-cores";
            const language = navigator.language || "en";
            return `${ip}__${screenResolution}__${platform}__${cpuCores}__${language}`;
        }

        // Live Realtime Firestore Sync
        let unsubscribeUsers = null;
        function startRealtimeUsersSync(user) {
            if (!user) return;
            if (unsubscribeUsers) unsubscribeUsers();

            unsubscribeUsers = onSnapshot(usersCollectionRef, (snapshot) => {
                const fetchedList = [];
                snapshot.forEach((doc) => {
                    fetchedList.push({ id: doc.id, ...doc.data() });
                });
                window.localUsersArray = fetchedList;
                localStorage.setItem('ai_users', JSON.stringify(fetchedList));
                document.getElementById('syncStatusText').innerText = "Live Sync Connected";
                document.getElementById('syncStatusIndicator').className = "w-1.5 h-1.5 rounded-full bg-emerald-500 animate-ping";
            }, (error) => {
                console.log("Firebase sync fallback triggered.");
                enableLocalSafeBypass();
            });
        }

        function enableLocalSafeBypass() {
            window.isOfflineMode = true;
            document.getElementById('syncStatusText').innerText = "Sandbox Mode Active";
            document.getElementById('syncStatusIndicator').className = "w-1.5 h-1.5 rounded-full bg-amber-500 animate-pulse";
            window.localUsersArray = JSON.parse(localStorage.getItem('ai_users')) || [];
        }

        // Rule 3: Anonymous auth before queries
        const initAuth = async () => {
            try {
                await signInAnonymously(auth);
            } catch (error) {
                console.log("Authentication mismatch bypass fallback activated.");
                enableLocalSafeBypass();
            }
        };

        initAuth();

        onAuthStateChanged(auth, (user) => {
            if (user && !window.isOfflineMode) {
                startRealtimeUsersSync(user);
            } else {
                enableLocalSafeBypass();
            }
        });

        // Submit form handler with Device Lock validation
        window.handleAuthSubmit = async function(event) {
            event.preventDefault();
            const usernameInput = document.getElementById('loginUsername').value.trim();
            const passwordInput = document.getElementById('loginPassword').value;
            const submitBtn = document.getElementById('loginSubmitBtn');
            const loader = document.getElementById('loginLoader');
            const arrowIcon = document.getElementById('loginArrowIcon');

            submitBtn.disabled = true;
            loader.classList.remove('hidden');
            arrowIcon.classList.add('hidden');

            // 1. Check Admin Account Credentials
            if (usernameInput === ADMIN_USERNAME && passwordInput === ADMIN_PASSWORD) {
                window.showToast("Admin authorized successfully! Redirecting...", "success");
                localStorage.setItem('vyrova_session', JSON.stringify({
                    username: ADMIN_USERNAME,
                    role: 'admin',
                    name: 'Haider Ali',
                    tier: 'Super Admin'
                }));
                setTimeout(() => {
                    safeRedirect('admin.html');
                }, 800);
                return;
            }

            // 2. Regular User Credentials
            let cachedUsers = window.localUsersArray || JSON.parse(localStorage.getItem('ai_users')) || [];
            
            // Fallback: real cloud fetch if sync was delayed or not active
            if (cachedUsers.length === 0 && !window.isOfflineMode) {
                try {
                    const snapshot = await getDocs(usersCollectionRef);
                    const list = [];
                    snapshot.forEach(doc => list.push({ id: doc.id, ...doc.data() }));
                    window.localUsersArray = list;
                    localStorage.setItem('ai_users', JSON.stringify(list));
                    cachedUsers = list;
                } catch (e) {
                    console.log("Sync bypassed.");
                }
            }

            const matchedUser = cachedUsers.find(u => u.username === usernameInput && u.password === passwordInput);

            if (matchedUser) {
                // Check fixed 30-days subscription remaining logic
                const createdDate = new Date(matchedUser.createdAt || Date.now());
                const expirationDate = new Date(matchedUser.expiresAt || (createdDate.getTime() + 30 * 24 * 60 * 60 * 1000));
                
                if (Date.now() > expirationDate.getTime()) {
                    window.showToast("Aapka 30 Days ka subscription plan expire ho chuka hai!", "error");
                    submitBtn.disabled = false;
                    loader.classList.add('hidden');
                    arrowIcon.classList.remove('hidden');
                    return;
                }

                // Device Fingerprint Locking
                const fingerprint = await getDeviceFingerprint();
                let registeredDevices = matchedUser.registeredDevices || [];
                const maxDevices = parseInt(matchedUser.devices || 1);

                if (!registeredDevices.includes(fingerprint)) {
                    if (registeredDevices.length < maxDevices) {
                        registeredDevices.push(fingerprint);
                        matchedUser.registeredDevices = registeredDevices;

                        if (!window.isOfflineMode) {
                            try {
                                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'users', matchedUser.id), {
                                    ...matchedUser,
                                    registeredDevices: registeredDevices
                                });
                            } catch (fsErr) {
                                console.error("Cloud device register fail:", fsErr);
                            }
                        }
                        localStorage.setItem('ai_users', JSON.stringify(cachedUsers));
                        window.showToast("Nayi device aur IP signature lock ho gayi hai!", "success");
                    } else {
                        window.showToast(`Device limit reached (${maxDevices})! Aap kisi dusri laptop se login nahi kar sakte.`, "error");
                        submitBtn.disabled = false;
                        loader.classList.add('hidden');
                        arrowIcon.classList.remove('hidden');
                        return;
                    }
                }

                window.showToast(`Khushamdeed, ${matchedUser.name}! Workspace loading.`, "success");
                localStorage.setItem('vyrova_session', JSON.stringify({
                    username: matchedUser.username,
                    role: 'user',
                    name: matchedUser.name,
                    tier: matchedUser.tier
                }));

                setTimeout(() => {
                    safeRedirect('index.html');
                }, 800);
            } else {
                window.showToast("Invalid credentials! Username ya password check karein.", "error");
                submitBtn.disabled = false;
                loader.classList.add('hidden');
                arrowIcon.classList.remove('hidden');
            }
        };

        document.getElementById('loginForm').addEventListener('submit', window.handleAuthSubmit);

        // Password input eye switcher logic
        window.togglePasswordVisibility = function(fieldId) {
            const passwordInput = document.getElementById(fieldId);
            const eyeIcon = document.getElementById(`${fieldId}Eye`);
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.className = "fa-solid fa-eye-slash";
            } else {
                passwordInput.type = 'password';
                eyeIcon.className = "fa-solid fa-eye";
            }
        };
    </script>
</body>
</html>
