<!-- login.html -->

<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VYROVA LOGIN</title>

<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

font-family:'DM Sans',sans-serif;
background:#07080f;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
color:#fff;

}

/* BACKGROUND */

.bg{

position:fixed;
inset:0;

background:

radial-gradient(circle at 15% 20%,rgba(109,40,217,.30),transparent 35%),

radial-gradient(circle at 80% 75%,rgba(37,99,235,.28),transparent 35%),

radial-gradient(circle at 50% 40%,rgba(13,148,136,.18),transparent 45%);

animation:move 10s infinite alternate ease-in-out;

}

@keyframes move{

from{
transform:scale(1);
}

to{
transform:scale(1.12);
}

}

.grid{

position:fixed;
inset:0;

background-image:

linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),

linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);

background-size:55px 55px;

}

/* CARD */

.card{

position:relative;
z-index:10;

width:520px;

padding:45px;

border-radius:34px;

background:rgba(18,22,36,.72);

backdrop-filter:blur(26px);

border:1px solid rgba(255,255,255,.08);

box-shadow:

0 35px 90px rgba(0,0,0,.50),

0 0 65px rgba(109,40,217,.18);

}

/* LOGO */

.logo{

display:flex;
align-items:center;
gap:16px;

margin-bottom:32px;

}

.mark{

width:68px;
height:68px;

border-radius:20px;

background:

linear-gradient(135deg,#6d28d9,#2563eb);

display:flex;
justify-content:center;
align-items:center;

font-family:'Syne';

font-size:30px;

font-weight:800;

box-shadow:

0 0 40px rgba(109,40,217,.45);

}

.logo h1{

font-family:'Syne';

font-size:30px;

letter-spacing:2px;

}

.sub{

font-size:12px;

letter-spacing:1px;

color:#8f98bf;

margin-top:4px;

}

/* TITLE */

.title{

font-family:'Syne';

font-size:46px;

line-height:1.1;

margin-bottom:12px;

}

.desc{

color:#9099c0;

line-height:1.8;

margin-bottom:35px;

}

/* INPUTS */

.group{

margin-bottom:22px;

}

.label{

font-size:13px;

margin-bottom:10px;

color:#a3abd1;

}

.inputbox{

height:66px;

display:flex;
align-items:center;

background:#14192d;

border:1px solid #252d4a;

border-radius:20px;

padding:0 18px;

transition:.25s;

}

.inputbox:focus-within{

border-color:#8b5cf6;

box-shadow:

0 0 25px rgba(109,40,217,.22);

}

.icon{

font-size:18px;

margin-right:12px;

}

input{

width:100%;

height:100%;

background:none;

border:none;

outline:none;

color:#fff;

font-size:15px;

}

.eye{

cursor:pointer;

font-size:18px;

}

/* BUTTON */

button{

width:100%;

height:68px;

border:none;

border-radius:22px;

cursor:pointer;

margin-top:10px;

font-family:'Syne';

font-size:16px;

font-weight:800;

letter-spacing:1px;

background:

linear-gradient(135deg,#6d28d9,#2563eb);

color:#fff;

transition:.25s;

}

button:hover{

transform:translateY(-2px);

box-shadow:

0 18px 40px rgba(109,40,217,.42);

}

/* ERROR */

#error{

margin-top:20px;

text-align:center;

color:#ff5d80;

}

/* FOOTER */

.footer{

margin-top:24px;

text-align:center;

font-size:13px;

color:#7782aa;

}

</style>

</head>

<body>

<div class="bg"></div>

<div class="grid"></div>

<div class="card">

<div class="logo">

<div class="mark">
V
</div>

<div>

<h1>VYROVA</h1>

<div class="sub">

AI CREATIVE SUITE

</div>

</div>

</div>

<div class="title">

Welcome Back.

</div>

<div class="desc">

Login to continue into your premium creative workspace.

</div>

<div class="group">

<div class="label">

Username

</div>

<div class="inputbox">

<div class="icon">

👤

</div>

<input
id="username"
placeholder="Enter Username">

</div>

</div>

<div class="group">

<div class="label">

Password

</div>

<div class="inputbox">

<div class="icon">

🔒

</div>

<input
id="password"
type="password"
placeholder="Enter Password">

<div
class="eye"
onclick="toggle()">

👁️

</div>

</div>

</div>

<button onclick="login()">

LOGIN TO VYROVA

</button>

<div id="error"></div>

<div class="footer">

Secure Login • VYROVA Workspace

</div>

</div>

<script>

function toggle(){

let p=
document.getElementById(
"password"
)

p.type=
p.type==="password"
?
"text"
:
"password"

}

/* LOGIN SYSTEM */

function login(){

let username=

document.getElementById(
"username"
).value.trim()

let password=

document.getElementById(
"password"
).value.trim()

/* ADMIN LOGIN */

if(

username==="923220498935"

&&

password==="HaiderAli000"

){

window.location=
"admin.html"

return

}

/* USER LOGIN */

let users=

JSON.parse(

localStorage.getItem(
"vyrovaUsers"
)

)||[]

let found=

users.find(

u=>

u.username===username

&&

u.password===password

)

if(found){

window.location=
"index.html"

}

else{

document.getElementById(
"error"
).innerText=

"Invalid Username Or Password"

}

}

</script>

</body>
</html>
