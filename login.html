<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>VYROVA LOGIN</title>

<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'DM Sans',sans-serif;
background:#07080f;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
overflow:hidden;
color:#fff;
}

.bg{
position:fixed;
inset:0;
background:
radial-gradient(circle at 20% 20%,rgba(109,40,217,.30),transparent 35%),
radial-gradient(circle at 80% 80%,rgba(37,99,235,.22),transparent 35%);
}

.card{

position:relative;
z-index:2;

width:540px;

padding:45px;

border-radius:32px;

background:rgba(18,22,36,.88);

backdrop-filter:blur(18px);

border:1px solid rgba(255,255,255,.05);

}

.logo{

display:flex;
align-items:center;
gap:15px;

margin-bottom:30px;

}

.mark{

width:70px;
height:70px;

border-radius:22px;

background:
linear-gradient(135deg,#6d28d9,#2563eb);

display:flex;
justify-content:center;
align-items:center;

font-family:'Syne';
font-size:30px;
font-weight:800;

}

.logo h1{
font-family:'Syne';
}

.sub{
font-size:12px;
color:#8f98bc;
}

.title{

font-family:'Syne';

font-size:52px;

margin-bottom:10px;

}

.desc{

color:#8e97bc;

margin-bottom:35px;

}

.group{
margin-bottom:22px;
}

label{

display:block;

margin-bottom:10px;

color:#9ca5cb;

}

.inputbox{

display:flex;
align-items:center;

height:70px;

padding:0 18px;

border-radius:20px;

background:#13192d;

}

input{

width:100%;
height:100%;

background:none;

border:none;

outline:none;

font-size:16px;

color:white;

}

.eye{
cursor:pointer;
font-size:20px;
}

button{

width:100%;

height:70px;

border:none;

border-radius:22px;

cursor:pointer;

font-family:'Syne';

font-size:16px;

font-weight:800;

background:
linear-gradient(135deg,#6d28d9,#2563eb);

color:white;

margin-top:12px;

}

#error{

margin-top:18px;

text-align:center;

color:#ff4d75;

font-size:15px;

}

.footer{

margin-top:24px;

text-align:center;

font-size:13px;

color:#7d87af;

}

</style>
</head>

<body>

<div class="bg"></div>

<div class="card">

<div class="logo">

<div class="mark">
V
</div>

<div>

<h1>VYROVA</h1>

<div class="sub">
AI CREATIVE SUITE
</div>

</div>

</div>

<div class="title">
Welcome Back
</div>

<div class="desc">
Login to continue into your premium workspace.
</div>

<div class="group">

<label>
Username
</label>

<div class="inputbox">

<input
id="username"
placeholder="Enter Username">

</div>

</div>

<div class="group">

<label>
Password
</label>

<div class="inputbox">

<input
id="password"
type="password"
placeholder="Enter Password">

<div
class="eye"
onclick="togglePassword()">

👁️

</div>

</div>

</div>

<button onclick="login()">

LOGIN TO VYROVA

</button>

<div id="error"></div>

<div class="footer">

Secure Login • VYROVA Workspace

</div>

</div>

<script>

function togglePassword(){

let p=

document.getElementById(
"password"
)

p.type=

p.type==="password"

?

"text"

:

"password"

}

/* LOGIN */

function login(){

let username=

document.getElementById(
"username"
).value.trim()

let password=

document.getElementById(
"password"
).value.trim()

let error=

document.getElementById(
"error"
)

error.innerText=""

/* ADMIN */

if(

username==="923220498935"

&&

password==="HaiderAli000"

){

localStorage.setItem(

"activeUser",

JSON.stringify({

username:"ADMIN",

role:"admin"

})

)

window.location=
"index.html"

return

}

/* USERS */

let users=

JSON.parse(

localStorage.getItem(
"vyrovaUsers"
)

)||[]

/* MATCH USER */

let found=

users.find(

u=>

String(
u.username
).trim()

===

String(username)
.trim()

&&

String(
u.password
).trim()

===

String(password)
.trim()

)

if(!found){

error.innerText=

"Invalid Username Or Password"

return

}

/* EXPIRY CHECK */

if(

found.expiry

&&

Date.now()

>

Number(
found.expiry
)

){

error.innerText=

"Account Expired"

return

}

/* SAVE SESSION */

localStorage.setItem(

"activeUser",

JSON.stringify({

username:
found.username,

role:"user",

device:
found.device,

days:
found.days,

expiry:
found.expiry

})

)

window.location=
"index.html"

}

</script>

</body>
</html>
