<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>VYROVA LOGIN</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#070b16;
color:#fff;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.card{

width:520px;

padding:40px;

background:#10172c;

border-radius:25px;

}

h1{
font-size:52px;
margin-bottom:10px;
}

p{
color:#9099be;
margin-bottom:30px;
}

input{

width:100%;

height:65px;

margin-bottom:20px;

padding:0 20px;

border:none;

border-radius:16px;

background:#161d35;

color:white;

font-size:16px;

}

button{

width:100%;

height:65px;

border:none;

border-radius:18px;

cursor:pointer;

font-size:16px;

font-weight:bold;

background:
linear-gradient(135deg,#6d28d9,#2563eb);

color:white;

}

#error{

margin-top:18px;

text-align:center;

color:#ff4567;

}

</style>
</head>
<body>

<div class="card">

<h1>
Welcome Back
</h1>

<p>
Login to continue into your premium workspace.
</p>

<input
id="username"
placeholder="Username">

<input
id="password"
type="password"
placeholder="Password">

<button onclick="login()">

LOGIN TO VYROVA

</button>

<div id="error"></div>

</div>

<script type="module">

import {

initializeApp

}

from

"https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";

import {

getFirestore,
collection,
getDocs

}

from

"https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

/* FIREBASE CONFIG */

const firebaseConfig = {

apiKey:
"AIzaSyBuYNUubdCfCktR1cWiKPJquVd8dbB-NUw",

authDomain:
"vyrova-2eb4d.firebaseapp.com",

projectId:
"vyrova-2eb4d",

storageBucket:
"vyrova-2eb4d.firebasestorage.app",

messagingSenderId:
"136436344218",

appId:
"1:136436344218:web:0efa47a4da3f20b7bc8623",

measurementId:
"G-1TNRGDFL4M"

};

const app=
initializeApp(firebaseConfig)

const db=
getFirestore(app)

/* LOGIN */

window.login=

async function(){

let username=

document.getElementById(
"username"
).value.trim()

let password=

document.getElementById(
"password"
).value.trim()

let error=

document.getElementById(
"error"
)

error.innerText=""

/* ADMIN */

if(

username==="923220498935"

&&

password==="HaiderAli000"

){

localStorage.setItem(

"activeUser",

JSON.stringify({

username:"ADMIN",

role:"admin"

})

)

window.location=
"index.html"

return

}

/* FIREBASE USERS */

const snapshot=

await getDocs(

collection(
db,
"users"
)

)

let found=null

snapshot.forEach((doc)=>{

let user=
doc.data()

if(

String(user.username)
.trim()

===

username

&&

String(user.password)
.trim()

===

password

){

found=user

}

})

if(!found){

error.innerText=

"Invalid Username Or Password"

return

}

/* EXPIRY */

if(

found.expiry

&&

Date.now()

>

Number(
found.expiry
)

){

error.innerText=

"Account Expired"

return

}

/* SAVE SESSION */

localStorage.setItem(

"activeUser",

JSON.stringify({

username:
found.username,

role:"user",

device:
found.device,

days:
found.days,

expiry:
found.expiry

})

)

window.location=
"index.html"

}

</script>

</body>
</html>
