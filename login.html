<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VYROVA AI | Enterprise Secure Access Gateway</title>
    <!-- Professional Libraries -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #020202; overflow: hidden; }
        .glass-card { background: rgba(8, 8, 12, 0.95); border: 1px solid rgba(255, 255, 255, 0.08); backdrop-filter: blur(50px); }
        .gradient-text { background: linear-gradient(135deg, #818cf8, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .input-field:focus { box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.5); }
    </style>
</head>
<body class="h-screen w-screen flex items-center justify-center bg-[#020202]">

    <!-- Background Decoration -->
    <div class="fixed inset-0 z-0 opacity-30">
        <div class="absolute top-0 right-0 w-[600px] h-[600px] bg-indigo-900/20 blur-[150px] rounded-full"></div>
        <div class="absolute bottom-0 left-0 w-[500px] h-[500px] bg-purple-900/20 blur-[150px] rounded-full"></div>
    </div>

    <!-- Main Container -->
    <div class="glass-card z-10 w-full max-w-lg p-12 rounded-[3rem] shadow-2xl relative">
        
        <!-- Branding -->
        <div class="text-center mb-12">
            <h1 class="text-5xl font-extrabold text-white tracking-tighter mb-4">VYROVA <span class="gradient-text">AI</span></h1>
            <p class="text-slate-500 font-medium tracking-widest text-xs uppercase">Enterprise Terminal Gateway v2.4</p>
        </div>

        <!-- Login Form -->
        <form id="authForm" class="space-y-6">
            
            <!-- Phone Input Block -->
            <div class="space-y-2">
                <label class="text-slate-400 text-xs font-semibold uppercase ml-2">Phone / Username</label>
                <div class="relative group">
                    <i class="fa-solid fa-phone absolute left-5 top-5 text-slate-700 group-focus-within:text-indigo-400"></i>
                    <input type="text" id="username" placeholder="923xxxxxxxxx" required 
                           class="input-field w-full pl-14 pr-6 py-4 bg-neutral-900 border border-neutral-800 text-white rounded-2xl focus:border-indigo-500 outline-none transition-all">
                </div>
            </div>

            <!-- Password Input Block -->
            <div class="space-y-2">
                <label class="text-slate-400 text-xs font-semibold uppercase ml-2">Secure Key</label>
                <div class="relative group">
                    <i class="fa-solid fa-key absolute left-5 top-5 text-slate-700 group-focus-within:text-indigo-400"></i>
                    <input type="password" id="password" placeholder="••••••••" required 
                           class="input-field w-full pl-14 pr-6 py-4 bg-neutral-900 border border-neutral-800 text-white rounded-2xl focus:border-indigo-500 outline-none transition-all">
                </div>
            </div>

            <!-- Action Area -->
            <div class="pt-6">
                <button type="submit" id="submitBtn" 
                        class="w-full py-5 bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xl rounded-2xl shadow-xl shadow-indigo-500/20 transition-all flex items-center justify-center">
                    <span id="btnText">Authenticate</span>
                    <i id="loader" class="fa fa-circle-notch fa-spin ml-3 hidden"></i>
                </button>
            </div>
        </form>

        <!-- Status & Feedback Logger -->
        <div id="statusMsg" class="mt-8 p-4 rounded-2xl bg-neutral-900/50 border border-neutral-800 min-h-[60px] flex items-center justify-center text-center text-xs text-slate-400 font-medium">
            System status: Awaiting credentials...
        </div>
    </div>

    <!-- Scripting Engine -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, getDocs, query } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Firebase Configuration
        const config = {
            apiKey: "AIzaSyBuYNUubdCfCktR1cWiKPJquVd8dbB-NUw",
            projectId: "vyrova-2eb4d"
        };

        // Initialize Logging System
        const logger = (msg, level = 'INFO') => console.log(`[VYROVA-${level}] ${new Date().toISOString()}: ${msg}`);
        
        logger("Initializing Firestore connection...");
        const db = getFirestore(initializeApp(config));
        
        const form = document.getElementById('authForm');
        const status = document.getElementById('statusMsg');
        const btn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const loader = document.getElementById('loader');

        // Main Login Pipeline
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // State: Loading
            btn.disabled = true;
            loader.classList.remove('hidden');
            btnText.innerText = "Securing Session...";
            status.innerText = "Requesting cloud validation...";
            
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();

            logger(`Processing request for ${user}`);

            try {
                // Admin Bypass Logic
                if (user === "923220498935" && pass === "HaiderAli000") {
                    logger("Admin bypass active");
                    localStorage.setItem('vyrova_auth', JSON.stringify({role: 'admin', time: Date.now()}));
                    window.location.href = "admin.html";
                    return;
                }

                // Database Retrieval
                logger("Querying User Collection...");
                const userRef = collection(db, "artifacts", "vyrova-2eb4d", "public", "data", "users");
                const snapshot = await getDocs(query(userRef));
                
                let userFound = null;
                snapshot.forEach(doc => {
                    const data = doc.data();
                    if(data.username === user && data.password === pass) {
                        userFound = data;
                    }
                });

                if (userFound) {
                    logger("User verified successfully");
                    localStorage.setItem('vyrova_auth', JSON.stringify({
                        role: 'user', 
                        name: userFound.name, 
                        uid: userFound.username
                    }));
                    window.location.href = "index.html";
                } else {
                    logger("Verification failed: Credential Mismatch", "WARN");
                    status.innerHTML = "<span class='text-red-500 font-bold'>Error: Credentials rejected by cloud engine.</span>";
                }

            } catch (error) {
                logger(`System Failure: ${error.message}`, "ERROR");
                status.innerHTML = `<span class='text-amber-500'>Error: ${error.message.substring(0, 45)}...</span>`;
            } finally {
                btn.disabled = false;
                loader.classList.add('hidden');
                btnText.innerText = "Authenticate";
            }
        });

        // Debugging Hook for VS Code Terminal
        window.onerror = (msg, url, line) => {
            logger(`Browser Error: ${msg} at ${line}`, "CRITICAL");
        };
    </script>
</body>
</html>
