<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>VYROVA ADMIN</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#070b16;
color:#fff;
padding:30px;
}

.container{
max-width:1500px;
margin:auto;
}

h1{
font-size:48px;
margin-bottom:25px;
}

.card{

background:#10172c;

padding:25px;

border-radius:22px;

margin-bottom:25px;

}

input,
select{

width:100%;

height:60px;

padding:0 18px;

margin-bottom:18px;

border:none;

border-radius:14px;

background:#161d35;

color:white;

font-size:15px;

}

button{

height:52px;

padding:0 20px;

border:none;

border-radius:12px;

cursor:pointer;

font-weight:bold;

color:white;

}

.create{
background:#6d28d9;
width:100%;
}

.tools{
background:#2563eb;
margin-top:10px;
}

.logout{
background:#ff4567;
margin-top:10px;
}

.edit{
background:#2563eb;
}

.delete{
background:#ff4567;
}

table{

width:100%;

border-collapse:collapse;

}

th,
td{

padding:16px;

text-align:left;

}

th{
background:#18203a;
}

td{
background:#10172c;
border-top:1px solid #1f2947;
}

.status-active{
color:#37ff8b;
font-weight:bold;
}

.status-expired{
color:#ff4567;
font-weight:bold;
}

</style>
</head>
<body>

<div class="container">

<h1>
VYROVA ADMIN PANEL
</h1>

<div class="card">

<h2 style="margin-bottom:20px;">
Create User
</h2>

<input
id="username"
placeholder="Username">

<input
id="password"
placeholder="Password">

<select id="device">

<option value="1">
1 Device
</option>

<option value="2">
2 Devices
</option>

<option value="3">
3 Devices
</option>

<option value="5">
5 Devices
</option>

</select>

<select id="days">

<option value="7">
7 Days
</option>

<option value="30">
30 Days
</option>

<option value="90">
90 Days
</option>

<option value="365">
365 Days
</option>

</select>

<button
class="create"
onclick="addUser()">

CREATE USER

</button>

<button
class="tools"
onclick="openTools()">

USE TOOLS

</button>

<button
class="logout"
onclick="logout()">

LOGOUT

</button>

</div>

<div class="card">

<h2 style="margin-bottom:20px;">
Users
</h2>

<table>

<thead>

<tr>

<th>Username</th>
<th>Password</th>
<th>Device</th>
<th>Days</th>
<th>Status</th>
<th>Actions</th>

</tr>

</thead>

<tbody id="usersTable">

</tbody>

</table>

</div>

</div>

<script type="module">

import {

initializeApp

}

from

"https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";

import {

getFirestore,
collection,
addDoc,
getDocs,
deleteDoc,
doc,
updateDoc

}

from

"https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

const firebaseConfig={

apiKey:"AIzaSyBuYNUubdCfCktR1cWiKPJquVd8dbB-NUw",

authDomain:"vyrova-2eb4d.firebaseapp.com",

projectId:"vyrova-2eb4d",

storageBucket:"vyrova-2eb4d.firebasestorage.app",

messagingSenderId:"136436344218",

appId:"1:136436344218:web:0efa47a4da3f20b7bc8623",

measurementId:"G-1TNRGDFL4M"

}

const app=
initializeApp(firebaseConfig)

const db=
getFirestore(app)

/* ADD USER */

window.addUser=

async function(){

let username=
document.getElementById(
"username"
).value.trim()

let password=
document.getElementById(
"password"
).value.trim()

let device=
Number(
document.getElementById(
"device"
).value
)

let days=
Number(
document.getElementById(
"days"
).value
)

if(
!username
||
!password
){

alert(
"Fill Fields"
)

return

}

let users=

await getDocs(

collection(
db,
"users"
)

)

let exists=false

users.forEach((d)=>{

let u=
d.data()

if(
u.username===username
){

exists=true

}

})

if(exists){

alert(
"Username Exists"
)

return

}

await addDoc(

collection(
db,
"users"
),

{

username,
password,
device,
days,

expiry:

Date.now()

+

(
days
*
86400000
)

}

)

alert(
"User Created"
)

loadUsers()

}

/* LOAD USERS */

async function loadUsers(){

let table=

document.getElementById(
"usersTable"
)

table.innerHTML=""

const snapshot=

await getDocs(

collection(
db,
"users"
)

)

snapshot.forEach((d)=>{

let u=
d.data()

let status=

Date.now()

>

u.expiry

?

'<span class="status-expired">Expired</span>'

:

'<span class="status-active">Active</span>'

table.innerHTML+=`

<tr>

<td>${u.username}</td>

<td>${u.password}</td>

<td>${u.device}</td>

<td>${u.days}</td>

<td>${status}</td>

<td>

<button
class="edit"
onclick="editUser('${d.id}')">

Edit

</button>

<button
class="delete"
onclick="removeUser('${d.id}')">

Delete

</button>

</td>

</tr>

`

})

}

/* EDIT */

window.editUser=

async function(id){

let mode=

prompt(

"1 Increase Device\n2 Decrease Device",

"1"

)

if(mode===null)
return

let amount=

parseInt(

prompt(
"Device Amount",
"1"
)

)

if(isNaN(amount))
return

let snap=

await getDocs(

collection(
db,
"users"
)

)

let user=null

snap.forEach((d)=>{

if(
d.id===id
){

user=d.data()

}

})

if(!user)
return

let device=
Number(user.device)

if(mode==="1"){

device+=amount

}

if(mode==="2"){

device-=amount

if(device<1){

device=1

}

}

let addDays=

parseInt(

prompt(
"Increase Days",
"7"
)

)

if(isNaN(addDays))
addDays=0

await updateDoc(

doc(
db,
"users",
id
),

{

device:device,

days:
Number(user.days)
+
addDays,

expiry:
Number(user.expiry)
+
(
addDays
*
86400000
)

}

)

loadUsers()

}

/* DELETE */

window.removeUser=

async function(id){

await deleteDoc(

doc(
db,
"users",
id
)

)

loadUsers()

}

/* TOOLS */

window.openTools=

function(){

localStorage.setItem(

"activeUser",

JSON.stringify({

username:"ADMIN",

role:"admin"

})

)

window.location=
"index.html"

}

/* LOGOUT */

window.logout=

function(){

localStorage.removeItem(
"activeUser"
)

window.location=
"login.html"

}

loadUsers()

</script>

</body>
</html>
