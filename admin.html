<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>VYROVA ADMIN</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#070b16;
color:#fff;
padding:30px;
}

.container{
max-width:1500px;
margin:auto;
}

h1{
font-size:42px;
margin-bottom:25px;
}

.card{
background:#10172c;
padding:25px;
border-radius:22px;
margin-bottom:25px;
}

input,select{

width:100%;

height:60px;

padding:0 18px;

margin-bottom:18px;

border:none;

border-radius:14px;

background:#161d35;

color:white;

font-size:15px;

}

button{

height:55px;

padding:0 20px;

border:none;

border-radius:12px;

cursor:pointer;

font-weight:bold;

color:white;

}

.create{
background:#6d28d9;
width:100%;
}

.tools{
background:#2563eb;
margin-top:10px;
width:100%;
}

.logout{
background:#ff4567;
margin-top:10px;
width:100%;
}

.edit{
background:#2563eb;
}

.delete{
background:#ff4567;
}

table{
width:100%;
border-collapse:collapse;
}

th,td{
padding:16px;
text-align:left;
}

th{
background:#18203a;
}

td{
background:#10172c;
border-top:1px solid #1f2947;
}

.active{
color:#37ff8b;
font-weight:bold;
}

.expired{
color:#ff4567;
font-weight:bold;
}

</style>
</head>
<body>

<div class="container">

<h1>VYROVA ADMIN PANEL</h1>

<div class="card">

<input
id="username"
placeholder="Username">

<input
id="password"
placeholder="Password">

<select id="device">

<option value="1">1 Device</option>
<option value="2">2 Devices</option>
<option value="3">3 Devices</option>
<option value="5">5 Devices</option>

</select>

<select id="days">

<option value="7">7 Days</option>
<option value="30">30 Days</option>
<option value="90">90 Days</option>
<option value="365">365 Days</option>

</select>

<button
id="createBtn"
class="create">

CREATE USER

</button>

<button
class="tools"
onclick="openTools()">

USE TOOLS

</button>

<button
class="logout"
onclick="logout()">

LOGOUT

</button>

</div>

<div class="card">

<table>

<thead>

<tr>

<th>User</th>
<th>Password</th>
<th>Device</th>
<th>Days</th>
<th>Status</th>
<th>Action</th>

</tr>

</thead>

<tbody id="usersTable">

</tbody>

</table>

</div>

</div>

<script type="module">

import { initializeApp }

from

"https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";

import {

getFirestore,
collection,
addDoc,
getDocs,
deleteDoc,
doc,
updateDoc

}

from

"https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

/* FIREBASE */

const firebaseConfig={

apiKey:"AIzaSyBuYNUubdCfCktR1cWiKPJquVd8dbB-NUw",
authDomain:"vyrova-2eb4d.firebaseapp.com",
projectId:"vyrova-2eb4d",
storageBucket:"vyrova-2eb4d.firebasestorage.app",
messagingSenderId:"136436344218",
appId:"1:136436344218:web:0efa47a4da3f20b7bc8623"

};

const app=
initializeApp(firebaseConfig)

const db=
getFirestore(app)

/* CREATE USER */

async function addUser(){

let username=
document.getElementById(
"username"
).value.trim()

let password=
document.getElementById(
"password"
).value.trim()

let device=
Number(
document.getElementById(
"device"
).value
)

let days=
Number(
document.getElementById(
"days"
).value
)

if(
!username
||
!password
){

alert(
"Fill Fields"
)

return

}

try{

const snap=

await getDocs(

collection(
db,
"users"
)

)

let exists=false

snap.forEach((d)=>{

let u=
d.data()

if(
u.username===username
){

exists=true

}

})

if(exists){

alert(
"Username Exists"
)

return

}

await addDoc(

collection(
db,
"users"
),

{

username,
password,
device,
days,

expiry:

Date.now()

+

(
days
*
86400000
)

}

)

alert(
"User Created Successfully"
)

document.getElementById(
"username"
).value=""

document.getElementById(
"password"
).value=""

loadUsers()

}

catch(e){

console.error(e)

alert(
"Firebase Error"
)

}

}

/* BUTTON FIX */

document.getElementById(
"createBtn"
)

.addEventListener(
"click",
addUser
)

/* LOAD USERS */

async function loadUsers(){

const table=

document.getElementById(
"usersTable"
)

table.innerHTML=""

const snap=

await getDocs(

collection(
db,
"users"
)

)

snap.forEach((d)=>{

let u=
d.data()

let status=

Date.now()>u.expiry

?

'<span class="expired">Expired</span>'

:

'<span class="active">Active</span>'

table.innerHTML+=`

<tr>

<td>${u.username}</td>
<td>${u.password}</td>
<td>${u.device}</td>
<td>${u.days}</td>
<td>${status}</td>

<td>

<button
class="edit"
onclick="editUser('${d.id}')">

Edit

</button>

<button
class="delete"
onclick="removeUser('${d.id}')">

Delete

</button>

</td>

</tr>

`

})

}

/* EDIT */

window.editUser=

async function(id){

let addDevice=

parseInt(

prompt(
"Device Change",
"1"
)

)

if(isNaN(addDevice))
return

let addDays=

parseInt(

prompt(
"Increase Days",
"7"
)

)

if(isNaN(addDays))
addDays=0

const snap=

await getDocs(

collection(
db,
"users"
)

)

let user=null

snap.forEach((d)=>{

if(d.id===id){

user=d.data()

}

})

if(!user)
return

await updateDoc(

doc(
db,
"users",
id
),

{

device:
Number(user.device)
+
addDevice,

days:
Number(user.days)
+
addDays,

expiry:
Number(user.expiry)
+
(
addDays
*
86400000
)

}

)

loadUsers()

}

/* DELETE */

window.removeUser=

async function(id){

await deleteDoc(

doc(
db,
"users",
id
)

)

loadUsers()

}

/* TOOLS */

window.openTools=

function(){

window.location=
"index.html"

}

/* LOGOUT */

window.logout=

function(){

localStorage.removeItem(
"activeUser"
)

window.location=
"login.html"

}

loadUsers()

</script>

</body>
</html>
