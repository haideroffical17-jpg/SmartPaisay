<!-- admin.html -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VYROVA ADMIN</title>

<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'DM Sans',sans-serif;
background:#07080f;
color:white;
overflow:hidden;
}

.bg{
position:fixed;
inset:0;
background:
radial-gradient(circle at 15% 20%,rgba(109,40,217,.30),transparent 35%),
radial-gradient(circle at 80% 80%,rgba(37,99,235,.25),transparent 35%),
radial-gradient(circle at 50% 40%,rgba(13,148,136,.14),transparent 40%);
z-index:0;
}

.container{
position:relative;
z-index:5;
display:flex;
height:100vh;
}

/* SIDEBAR */

.sidebar{

width:270px;

background:rgba(18,22,36,.85);

backdrop-filter:blur(18px);

border-right:1px solid rgba(255,255,255,.05);

padding:30px;

}

.logo{
display:flex;
align-items:center;
gap:15px;
margin-bottom:45px;
}

.mark{

width:65px;
height:65px;

border-radius:20px;

background:linear-gradient(135deg,#6d28d9,#2563eb);

display:flex;
justify-content:center;
align-items:center;

font-size:28px;
font-family:'Syne';
font-weight:800;

}

.logo h1{
font-family:'Syne';
letter-spacing:2px;
}

.logo p{
font-size:12px;
color:#8891b4;
}

.nav{
display:flex;
flex-direction:column;
gap:14px;
}

.nav button{

height:58px;

border:none;

border-radius:18px;

background:#151a2c;

color:white;

cursor:pointer;

font-size:15px;

font-weight:700;

transition:.25s;

}

.nav button:hover{

background:#6d28d9;

}

/* MAIN */

.main{

flex:1;

padding:35px;

overflow:auto;

}

.top{

display:flex;
justify-content:space-between;
align-items:center;

margin-bottom:35px;

}

.title{

font-size:42px;

font-family:'Syne';

}

.logout{

height:58px;

padding:0 30px;

border:none;

border-radius:18px;

background:linear-gradient(135deg,#6d28d9,#2563eb);

color:white;

cursor:pointer;

font-weight:800;

}

/* STATS */

.cards{

display:grid;

grid-template-columns:repeat(3,1fr);

gap:22px;

margin-bottom:30px;

}

.card{

background:rgba(18,22,36,.80);

border:1px solid rgba(255,255,255,.05);

padding:28px;

border-radius:28px;

}

.card h2{

font-size:42px;

font-family:'Syne';

margin-bottom:8px;

}

.card p{
color:#8f97bc;
}

/* PANEL */

.panel{

display:grid;

grid-template-columns:430px 1fr;

gap:25px;

}

/* FORM */

.formbox{

background:rgba(18,22,36,.82);

padding:35px;

border-radius:30px;

}

.formbox h2{

font-family:'Syne';

margin-bottom:28px;

}

.group{
margin-bottom:18px;
}

label{

display:block;

margin-bottom:10px;

color:#99a3ca;

}

input,select{

width:100%;

height:62px;

background:#14192c;

border:1px solid #252d49;

border-radius:18px;

padding:0 18px;

outline:none;

color:white;

font-size:15px;

}

.create{

width:100%;

height:65px;

margin-top:10px;

border:none;

border-radius:20px;

cursor:pointer;

background:linear-gradient(135deg,#6d28d9,#2563eb);

font-weight:800;

color:white;

}

/* TABLE */

.tablebox{

background:rgba(18,22,36,.82);

padding:35px;

border-radius:30px;

overflow:auto;

}

.tablebox h2{

font-family:'Syne';

margin-bottom:25px;

}

table{

width:100%;

border-collapse:collapse;

}

th{

text-align:left;

padding-bottom:18px;

color:#9ca5cb;

}

td{

padding:18px 0;

border-top:1px solid rgba(255,255,255,.05);

}

.delete{

border:none;

padding:12px 18px;

border-radius:14px;

cursor:pointer;

background:#ff4567;

color:white;

font-weight:700;

}

</style>
</head>

<body>

<div class="bg"></div>

<div class="container">

<div class="sidebar">

<div class="logo">

<div class="mark">
V
</div>

<div>

<h1>VYROVA</h1>

<p>ADMIN PANEL</p>

</div>

</div>

<div class="nav">

<button>Dashboard</button>

<button>Users</button>

<button>Settings</button>

<button onclick="logout()">
Logout
</button>

</div>

</div>

<div class="main">

<div class="top">

<div class="title">
Admin Dashboard
</div>

<button class="logout" onclick="logout()">
Logout
</button>

</div>

<div class="cards">

<div class="card">

<h2 id="usersCount">
0
</h2>

<p>Total Users</p>

</div>

<div class="card">

<h2>
LIVE
</h2>

<p>System Status</p>

</div>

<div class="card">

<h2>
∞
</h2>

<p>Premium Access</p>

</div>

</div>

<div class="panel">

<div class="formbox">

<h2>
Create User
</h2>

<div class="group">

<label>Username</label>

<input id="username">

</div>

<div class="group">

<label>Password</label>

<input id="password">

</div>

<div class="group">

<label>Device Limit</label>

<select id="device">

<option>1</option>
<option>2</option>
<option>3</option>
<option>5</option>

</select>

</div>

<div class="group">

<label>Access Days</label>

<select id="days">

<option>7</option>
<option>30</option>
<option>90</option>
<option>365</option>

</select>

</div>

<button class="create" onclick="addUser()">

CREATE USER

</button>

</div>

<div class="tablebox">

<h2>
User Management
</h2>

<table>

<thead>

<tr>

<th>Username</th>
<th>Password</th>
<th>Device</th>
<th>Days</th>
<th>Action</th>

</tr>

</thead>

<tbody id="usersTable">

</tbody>

</table>

</div>

</div>

</div>

</div>

<script>

let users=

JSON.parse(
localStorage.getItem(
"vyrovaUsers"
)
)||[]

function saveUsers(){

localStorage.setItem(
"vyrovaUsers",
JSON.stringify(users)
)

}

function render(){

let table=
document.getElementById(
"usersTable"
)

table.innerHTML=""

users.forEach((u,i)=>{

table.innerHTML+=`

<tr>

<td>${u.username}</td>

<td>${u.password}</td>

<td>${u.device}</td>

<td>${u.days}</td>

<td>

<button
class="delete"
onclick="removeUser(${i})">

Delete

</button>

</td>

</tr>

`

})

document.getElementById(
"usersCount"
).innerText=
users.length

}

function addUser(){

let username=
document.getElementById(
"username"
).value.trim()

let password=
document.getElementById(
"password"
).value.trim()

let device=
document.getElementById(
"device"
).value

let days=
document.getElementById(
"days"
).value

if(
!username
||
!password
){

alert(
"Fill All Fields"
)

return

}

let exists=

users.find(
u=>u.username===username
)

if(exists){

alert(
"Username Already Exists"
)

return

}

users.push({

username,
password,
device,
days

})

saveUsers()

render()

document.getElementById(
"username"
).value=""

document.getElementById(
"password"
).value=""

}

function removeUser(i){

if(
confirm(
"Delete User?"
)
){

users.splice(i,1)

saveUsers()

render()

}

}

function logout(){

window.location=
"login.html"

}

render()

</script>

</body>
</html>
