<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>VYROVA ADMIN</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0b0f1d;
color:white;
padding:30px;
}

.container{
max-width:1400px;
margin:auto;
}

h1{
margin-bottom:25px;
}

.card{

background:#13192d;

padding:25px;

border-radius:18px;

margin-bottom:25px;

}

input,
select{

width:100%;

height:55px;

margin-top:8px;

margin-bottom:18px;

padding:0 15px;

border:none;

border-radius:12px;

background:#1c2340;

color:#fff;

}

button{

height:50px;

padding:0 20px;

border:none;

border-radius:12px;

cursor:pointer;

font-weight:bold;

}

.create{

background:#6d28d9;

color:white;

width:100%;

}

.tools{
background:#2563eb;
color:white;
margin-top:10px;
}

.logout{
background:#ff4567;
color:white;
margin-top:10px;
}

table{

width:100%;

border-collapse:collapse;

}

th,
td{

padding:16px;

text-align:left;

}

th{
background:#161d35;
}

td{
background:#11172a;
border-top:1px solid #1e2747;
}

.edit{
background:#2563eb;
color:white;
}

.delete{
background:#ff4567;
color:white;
}

</style>
</head>
<body>

<div class="container">

<h1>
VYROVA ADMIN PANEL
</h1>

<div class="card">

<h2>
Create User
</h2>

<input
id="username"
placeholder="Username">

<input
id="password"
placeholder="Password">

<select id="device">

<option value="1">
1 Device
</option>

<option value="2">
2 Devices
</option>

<option value="3">
3 Devices
</option>

<option value="5">
5 Devices
</option>

</select>

<select id="days">

<option value="7">
7 Days
</option>

<option value="30">
30 Days
</option>

<option value="90">
90 Days
</option>

<option value="365">
365 Days
</option>

</select>

<button
class="create"
onclick="addUser()">

CREATE USER

</button>

<button
class="tools"
onclick="openTools()">

USE TOOLS

</button>

<button
class="logout"
onclick="logout()">

LOGOUT

</button>

</div>

<div class="card">

<h2>
Users
</h2>

<table>

<thead>

<tr>

<th>User</th>
<th>Password</th>
<th>Device</th>
<th>Days</th>
<th>Status</th>
<th>Actions</th>

</tr>

</thead>

<tbody id="usersTable">

</tbody>

</table>

</div>

</div>

<script>

let users=

JSON.parse(

localStorage.getItem(
"vyrovaUsers"
)

)||[]

function save(){

localStorage.setItem(

"vyrovaUsers",

JSON.stringify(users)

)

}

/* ADD USER */

function addUser(){

let username=

document.getElementById(
"username"
).value.trim()

let password=

document.getElementById(
"password"
).value.trim()

let device=

parseInt(

document.getElementById(
"device"
).value

)

let days=

parseInt(

document.getElementById(
"days"
).value

)

if(
!username
||
!password
){

alert(
"Fill Fields"
)

return

}

let exists=

users.find(

u=>

String(
u.username
).trim()

===

String(username)
.trim()

)

if(exists){

alert(
"Username Exists"
)

return

}

users.push({

username:
String(username),

password:
String(password),

device:
Number(device),

days:
Number(days),

expiry:

Date.now()

+

(
Number(days)
*
86400000
)

})

save()

render()

alert(
"User Created"
)

}

/* RENDER */

function render(){

let table=

document.getElementById(
"usersTable"
)

table.innerHTML=""

users.forEach((u,i)=>{

let status=

Date.now()>

u.expiry

?

"Expired"

:

"Active"

table.innerHTML+=`

<tr>

<td>${u.username}</td>

<td>${u.password}</td>

<td>${u.device}</td>

<td>${u.days}</td>

<td>${status}</td>

<td>

<button
class="edit"
onclick="editUser(${i})">

Edit

</button>

<button
class="delete"
onclick="removeUser(${i})">

Delete

</button>

</td>

</tr>

`

})

}

/* EDIT */

function editUser(i){

let mode=

prompt(

"1 Increase Device\n2 Decrease Device",

"1"

)

if(mode===null)
return

let amount=

parseInt(

prompt(
"Device Amount",
"1"
)

)

if(isNaN(amount))
return

if(mode==="1"){

users[i].device+=amount

}

if(mode==="2"){

users[i].device-=amount

if(
users[i].device<1
){

users[i].device=1

}

}

let addDays=

parseInt(

prompt(
"Increase Days",
"7"
)

)

if(isNaN(addDays))
addDays=0

users[i].days+=addDays

users[i].expiry+=

(
addDays*
86400000
)

save()

render()

}

/* DELETE */

function removeUser(i){

if(
confirm(
"Delete User?"
)
){

users.splice(i,1)

save()

render()

}

}

/* TOOLS */

function openTools(){

localStorage.setItem(

"activeUser",

JSON.stringify({

username:"ADMIN",

role:"admin"

})

)

window.location=
"index.html"

}

/* LOGOUT */

function logout(){

localStorage.removeItem(
"activeUser"
)

window.location=
"login.html"

}

render()

</script>

</body>
</html>
