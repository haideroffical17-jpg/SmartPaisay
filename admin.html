<!-- admin.html -->

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>VYROVA ADMIN</title>

<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'DM Sans',sans-serif;
background:#07080f;
color:#fff;
overflow:hidden;
}

.bg{
position:fixed;
inset:0;
background:
radial-gradient(circle at 20% 20%,rgba(109,40,217,.30),transparent 35%),
radial-gradient(circle at 80% 80%,rgba(37,99,235,.25),transparent 35%);
}

.container{
display:flex;
height:100vh;
position:relative;
z-index:2;
}

.sidebar{

width:270px;

background:rgba(18,22,36,.88);

padding:30px;

backdrop-filter:blur(18px);

border-right:1px solid rgba(255,255,255,.05);

}

.logo{

display:flex;
align-items:center;
gap:15px;

margin-bottom:45px;

}

.mark{

width:68px;
height:68px;

border-radius:22px;

background:
linear-gradient(135deg,#6d28d9,#2563eb);

display:flex;
justify-content:center;
align-items:center;

font-family:'Syne';

font-size:30px;

font-weight:800;

}

.logo h1{
font-family:'Syne';
}

.logo p{
font-size:12px;
color:#8f98bc;
}

.nav{
display:flex;
flex-direction:column;
gap:14px;
}

.nav button{

height:58px;

border:none;

border-radius:18px;

background:#15192c;

color:#fff;

font-weight:700;

cursor:pointer;

transition:.25s;

}

.nav button:hover{
background:#6d28d9;
}

.main{

flex:1;

padding:35px;

overflow:auto;

}

.header{

display:flex;
justify-content:space-between;
align-items:center;

margin-bottom:30px;

}

.title{

font-family:'Syne';

font-size:42px;

}

.logout{

height:58px;

padding:0 30px;

border:none;

border-radius:18px;

cursor:pointer;

font-weight:800;

background:
linear-gradient(135deg,#6d28d9,#2563eb);

color:#fff;

}

.cards{

display:grid;

grid-template-columns:repeat(4,1fr);

gap:20px;

margin-bottom:28px;

}

.card{

background:rgba(18,22,36,.82);

padding:26px;

border-radius:30px;

}

.card h2{

font-size:40px;

font-family:'Syne';

margin-bottom:8px;

}

.card p{

color:#9099be;

}

.panel{

display:grid;

grid-template-columns:420px 1fr;

gap:24px;

}

.formbox,
.tablebox{

background:rgba(18,22,36,.84);

padding:35px;

border-radius:30px;

}

.formbox h2,
.tablebox h2{

font-family:'Syne';

margin-bottom:25px;

}

.group{
margin-bottom:18px;
}

label{

display:block;

margin-bottom:10px;

color:#9aa2c8;

}

input,
select{

width:100%;

height:62px;

border:none;

border-radius:18px;

background:#14192d;

padding:0 18px;

color:white;

font-size:15px;

outline:none;

}

.create{

width:100%;

height:65px;

margin-top:10px;

border:none;

border-radius:20px;

cursor:pointer;

font-weight:800;

background:
linear-gradient(135deg,#6d28d9,#2563eb);

color:#fff;

}

table{

width:100%;

border-collapse:collapse;

}

th{

text-align:left;

padding-bottom:16px;

color:#9aa3ca;

}

td{

padding:18px 0;

border-top:1px solid rgba(255,255,255,.05);

}

.actions{
display:flex;
gap:10px;
}

.edit,
.delete{

border:none;

padding:12px 18px;

border-radius:14px;

cursor:pointer;

font-weight:700;

color:#fff;

}

.edit{
background:#2563eb;
}

.delete{
background:#ff4567;
}

</style>
</head>

<body>

<div class="bg"></div>

<div class="container">

<div class="sidebar">

<div class="logo">

<div class="mark">
V
</div>

<div>

<h1>VYROVA</h1>

<p>ADMIN PANEL</p>

</div>

</div>

<div class="nav">

<button>Dashboard</button>

<button onclick="openTools()">

Use Tools

</button>

<button onclick="logout()">

Logout

</button>

</div>

</div>

<div class="main">

<div class="header">

<div class="title">

Admin Dashboard

</div>

<button class="logout" onclick="logout()">

Logout

</button>

</div>

<div class="cards">

<div class="card">

<h2 id="usersCount">

0

</h2>

<p>Total Users</p>

</div>

<div class="card">

<h2>
LIVE
</h2>

<p>System Status</p>

</div>

<div class="card">

<h2>
VIP
</h2>

<p>Premium Access</p>

</div>

<div class="card">

<h2>
∞
</h2>

<p>Admin Control</p>

</div>

</div>

<div class="panel">

<div class="formbox">

<h2>

Create User

</h2>

<div class="group">

<label>Username</label>

<input id="username">

</div>

<div class="group">

<label>Password</label>

<input id="password">

</div>

<div class="group">

<label>Device Limit</label>

<select id="device">

<option>1</option>
<option>2</option>
<option>3</option>
<option>5</option>

</select>

</div>

<div class="group">

<label>Access Days</label>

<select id="days">

<option>7</option>
<option>30</option>
<option>90</option>
<option>365</option>

</select>

</div>

<button class="create" onclick="addUser()">

CREATE USER

</button>

</div>

<div class="tablebox">

<h2>

User Management

</h2>

<table>

<thead>

<tr>

<th>User</th>
<th>Password</th>
<th>Device</th>
<th>Days</th>
<th>Status</th>
<th>Action</th>

</tr>

</thead>

<tbody id="usersTable">

</tbody>

</table>

</div>

</div>

</div>

</div>

<script>

let users=

JSON.parse(
localStorage.getItem(
"vyrovaUsers"
)
)||[]

function save(){

localStorage.setItem(
"vyrovaUsers",
JSON.stringify(users)
)

}

function getStatus(user){

return Date.now()>user.expiry
?
"Expired"
:
"Active"

}

function render(){

let table=
document.getElementById(
"usersTable"
)

table.innerHTML=""

users.forEach((u,i)=>{

table.innerHTML+=`

<tr>

<td>${u.username}</td>
<td>${u.password}</td>
<td>${u.device}</td>
<td>${u.days}</td>
<td>${getStatus(u)}</td>

<td>

<div class="actions">

<button
class="edit"
onclick="editUser(${i})">

Edit

</button>

<button
class="delete"
onclick="removeUser(${i})">

Delete

</button>

</div>

</td>

</tr>

`

})

document.getElementById(
"usersCount"
).innerText=
users.length

}

function addUser(){

let username=
document.getElementById(
"username"
).value.trim()

let password=
document.getElementById(
"password"
).value.trim()

let device=
parseInt(
document.getElementById(
"device"
).value
)

let days=
parseInt(
document.getElementById(
"days"
).value
)

if(
!username
||
!password
){

alert(
"Fill All Fields"
)

return

}

users.push({

username,
password,
device,
days,

expiry:

Date.now()+(
days*
24*
60*
60*
1000
)

})

save()

render()

}

function editUser(i){

let mode=

prompt(

"1 Increase Device\n2 Decrease Device",

"1"

)

if(mode===null)
return

let deviceValue=

parseInt(

prompt(
"Device Amount",
"1"
)

)

if(mode==="1"){

users[i].device+=
deviceValue

}

if(mode==="2"){

users[i].device-=
deviceValue

if(
users[i].device<1
){

users[i].device=1

}

}

let addDays=

parseInt(

prompt(
"Increase Days",
"7"
)

)

users[i].days+=
addDays

users[i].expiry+=

(
addDays*
24*
60*
60*
1000
)

save()

render()

}

function removeUser(i){

if(
confirm(
"Delete User?"
)
){

users.splice(i,1)

save()

render()

}

}

function openTools(){

localStorage.setItem(

"activeUser",

JSON.stringify({

username:"ADMIN",

role:"admin"

})

)

window.location=
"index.html"

}

function logout(){

localStorage.removeItem(
"activeUser"
)

window.location=
"login.html"

}

render()

</script>

</body>
</html>
